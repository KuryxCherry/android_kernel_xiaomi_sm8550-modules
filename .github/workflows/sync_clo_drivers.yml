name: Sync Upstream CLO / LineageOS Drivers

on:
  workflow_dispatch:
    inputs:
      target:
        description: "要同步的目标（lineageos 或指定 KAILUA CLO 驱动子系统）"
        required: true
        default: "graphics-kernel"
        type: choice
        options:
          - lineageos
          - graphics-kernel
          - display-drivers
          - camera-kernel
          - video-driver
          - eva-kernel
          - wlan-qcacld-3.0
          - wlan-cmn
          - wlan-fw-api
          - dataipa
          - securemsm-kernel
      clo_tag:
        description: "目标 CLO Tag（选 lineageos 时留空；如 GRAPHICS.LA.1.0.r1-10600-KAILUA.0）"
        required: false
        default: ""
        type: string
      dry_run:
        description: "仅演练合并检测冲突，不推送"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    name: Sync Drivers (${{ inputs.target }})
    runs-on: ubuntu-24.04

    steps:
      - name: 检出完整仓库历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拉取并安全合并上游驱动
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET="${{ inputs.target }}"
          TAG="${{ inputs.clo_tag }}"

          if [ "${TARGET}" = "lineageos" ]; then
            git remote add upstream https://github.com/LineageOS/android_kernel_xiaomi_sm8550-modules.git
            git fetch --no-tags upstream lineage-24.0
            BEHIND=$(git rev-list --count HEAD..upstream/lineage-24.0)
            echo "Commits available from LineageOS: ${BEHIND}"
            [ "${BEHIND}" = "0" ] && exit 0
            if ! git merge --no-edit --no-ff upstream/lineage-24.0; then
              echo "=== CONFLICTS DETECTED (aborted safely) ==="
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 1
            fi
          else
            [ -n "${TAG}" ] || { echo "ERROR: clo_tag is required for target ${TARGET}"; exit 1; }
            case "${TARGET}" in
              graphics-kernel)
                REPO="https://git.codelinaro.org/clo/la/platform/vendor/qcom/opensource/graphics-kernel.git"
                PREFIX="qcom/opensource/graphics-kernel"
                ;;
              display-drivers)
                REPO="https://git.codelinaro.org/clo/la/platform/vendor/opensource/display-drivers.git"
                PREFIX="qcom/opensource/display-drivers"
                ;;
              camera-kernel)
                REPO="https://git.codelinaro.org/clo/la/platform/vendor/opensource/camera-kernel.git"
                PREFIX="qcom/opensource/camera-kernel"
                ;;
              video-driver)
                REPO="https://git.codelinaro.org/clo/la/platform/vendor/opensource/video-driver.git"
                PREFIX="qcom/opensource/video-driver"
                ;;
              eva-kernel)
                REPO="https://git.codelinaro.org/clo/la/platform/vendor/opensource/eva-kernel.git"
                PREFIX="qcom/opensource/eva-kernel"
                ;;
              wlan-qcacld-3.0)
                REPO="https://git.codelinaro.org/clo/la/platform/vendor/qcom-opensource/wlan/qcacld-3.0.git"
                PREFIX="qcom/opensource/wlan/qcacld-3.0"
                ;;
              wlan-cmn)
                REPO="https://git.codelinaro.org/clo/la/platform/vendor/qcom-opensource/wlan/qca-wifi-host-cmn.git"
                PREFIX="qcom/opensource/wlan/qca-wifi-host-cmn"
                ;;
              wlan-fw-api)
                REPO="https://git.codelinaro.org/clo/la/platform/vendor/qcom-opensource/wlan/fw-api.git"
                PREFIX="qcom/opensource/wlan/fw-api"
                ;;
              dataipa)
                REPO="https://git.codelinaro.org/clo/la/platform/vendor/opensource/dataipa.git"
                PREFIX="qcom/opensource/dataipa"
                ;;
              securemsm-kernel)
                REPO="https://git.codelinaro.org/clo/la/platform/vendor/qcom/opensource/securemsm-kernel.git"
                PREFIX="qcom/opensource/securemsm-kernel"
                ;;
            esac

            echo "Fetching tag ${TAG} from ${REPO} into ${PREFIX}..."
            git fetch "${REPO}" "refs/tags/${TAG}"
            if ! git merge --no-edit -X "subtree=${PREFIX}" FETCH_HEAD -m "Merge tag '${TAG}' into ${PREFIX}"; then
              echo "=== MERGE CONFLICTS DETECTED (aborted safely) ==="
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 1
            fi
          fi

          git log -n 3 --oneline
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry-run enabled; skipping push."
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
